services:
  api:
    build:
      context: ./api
      target: production
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      blockchain:
        condition: service_started
    networks:
      - s2dent-net

  web:
    build:
      context: ./web
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
    ports:
      - "4585:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - s2dent-net

  blockchain:
    build:
      context: ./blockchain
    ports:
      - "8545:8545"
    networks:
      - s2dent-net

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - s2dent-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - s2dent-net

networks:
  s2dent-net:
    driver: bridge

volumes:
  pgdata: